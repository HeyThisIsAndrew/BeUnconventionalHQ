name: Sync Substack articles
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe Substack from GitHub
        run: |
          node --input-type=module <<'JS'
          const base='https://beunconventionalhq.substack.com';
          const urls=[base+'/api/v1/posts?limit=2',base+'/feed',base+'/p/clayface-review',base+'/api/v1/archive?sort=new&offset=0&limit=2','https://substack.com/api/v1/publication/8894336/posts?limit=2'];
          await Promise.all(urls.map(async url=>{
            try { const r=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'}});const s=await r.text();console.log(JSON.stringify({url,status:r.status,type:r.headers.get('content-type'),length:s.length,start:s.slice(0,100)}));}catch(e){console.log(url,e.message)}
          }));
          const {default:puppeteer}=await import('puppeteer');
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          try {const page=await browser.newPage();for(const url of urls.slice(0,3)){try {const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});console.log(JSON.stringify({browser:true,url,status:r.status(),title:await page.title(),length:(await page.content()).length}));}catch(e){console.log('browser',url,e.message)}}} finally {await browser.close()}
          JS
      - name: Probe browser TLS transport
        run: |
          python3 -m pip install --quiet curl_cffi
          python3 <<'PY'
          from curl_cffi import requests
          for path in ['/api/v1/posts?limit=2','/feed','/p/clayface-review']:
            try:
              r=requests.get('https://beunconventionalhq.substack.com'+path,impersonate='chrome',timeout=20)
              print({'transport':'curl_cffi','path':path,'status':r.status_code,'type':r.headers.get('content-type'),'length':len(r.content),'start':r.text[:100]})
            except Exception as e:
              print(type(e).__name__,str(e))
          PY
