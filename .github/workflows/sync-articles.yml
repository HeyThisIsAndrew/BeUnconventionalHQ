# Public Substack posts -> committed snapshot -> deploy.yml workflow_run.
name: Sync Substack articles

on:
  repository_dispatch:
    types: [content-published]
  schedule:
    - cron: '30 * * * *' # Hourly, staggered from YouTube and Instagram
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write articles and image assets (uncheck for a dry run)'
        type: boolean
        default: true

# All content writers share this group. Never cancel a run during a push.
concurrency:
  group: content-sync-push
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.source != 'youtube'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Article sync regression tests
        run: node --test scripts/article-sync.test.mjs

      # Direct API first, owned Cloudflare relay when Substack blocks runners,
      # then RSS + post JSON. Any exhausted/empty source fails this step and
      # preserves the snapshot; failed publishing must never report success.
      - name: Run sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            npm run sync-articles
          else
            npm run sync-articles -- --execute
          fi

      # A missing rendition keeps its working original image URL. Retry missing
      # images on every execute run, even if no article text changed.
      - name: Build article image renditions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            npm run sync:article-images
          else
            npm run sync:article-images -- --execute || echo "article-image sync degraded; originals still render"
          fi

      - name: Build newsletter images
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            npm run sync:dispatch-images
          else
            npm run sync:dispatch-images -- --execute || echo "dispatch-image sync degraded; the feed uses the fallback art"
          fi

      - name: Commit and push if anything changed
        if: github.event_name != 'workflow_dispatch' || inputs.execute
        env:
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          # Stage manifests WITH their images, including newly created files.
          git add src/data/articles.json src/data/article-images.json public/article-images src/data/dispatch-images.json public/dispatch/images
          if git diff --cached --quiet; then
            echo "No content changes — nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: automated Substack articles sync" -m "Synced by the sync-articles.yml workflow (run ${{ github.run_id }})."
          git pull --rebase origin "$SYNC_BRANCH"
          git push origin "HEAD:$SYNC_BRANCH"
