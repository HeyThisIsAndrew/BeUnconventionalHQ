# Automated Substack -> articles.json sync.
name: Sync Substack articles

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write articles.json (uncheck for a dry-run preview only)'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            npm run sync-articles
          else
            npm run sync-articles -- --execute
          fi

      - name: Commit and push if articles.json changed
        run: |
          if git diff --quiet -- src/data/articles.json; then
            echo "No changes — nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json
          git commit -m "chore: automated Substack articles sync" -m "Synced by the sync-articles.yml workflow (run ${{ github.run_id }})."
          git push origin HEAD:${{ github.ref }}
