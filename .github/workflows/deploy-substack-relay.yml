# The small fixed-publication fetcher lives separately from the website.
# It changes only when its source changes, never on an hourly content sync.
name: Deploy Substack source relay

on:
  push:
    branches: [main]
    paths:
      - scripts/substack-post-html.mjs
      - scripts/substack-browser-source.mjs
      - scripts/substack-watcher.mjs
      - src/lib/automation-auth.mjs
      - src/lib/automation-notifications.mjs
      - scripts/substack-relay.mjs
      - scripts/substack-relay.wrangler.jsonc
      - .github/workflows/deploy-substack-relay.yml
  workflow_dispatch:
    inputs:
      diagnose_source:
        description: 'Verify the full article source in an isolated temporary Worker'
        type: boolean
        default: false

concurrency:
  group: substack-relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b10b7bc3e6a0fd361ba0956c8aa7d307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Create isolated diagnostic configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/substack-probe.json`, JSON.stringify({
            name: 'hq-substack-source-preview', main: `${process.cwd()}/scripts/substack-source-preview.mjs`,
            compatibility_date: '2026-10-27', workers_dev: true,
            browser: { binding: 'BROWSER' },
          }));
          JS
      - name: Verify full source and article sync without changing production
        run: |
          npx wrangler deploy --config "$RUNNER_TEMP/substack-probe.json"
          node --input-type=module <<'JS'
          import { fetchPostsRelay } from './scripts/substack-source.mjs';
          import { runArticleSync } from './scripts/sync-articles.mjs';
          const relayUrl = 'https://hq-substack-source-preview.heythisisandrewb.workers.dev/posts';
          for (let attempt = 0; attempt < 10; attempt++) {
            const response = await fetch(relayUrl, { signal: AbortSignal.timeout(100000) });
            if (response.ok) break;
            if (response.status !== 404) throw new Error(`Preview returned HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`);
            if (attempt === 9) throw new Error('Preview route did not propagate');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          const { posts } = await fetchPostsRelay({ relayUrl });
          console.log(`Cloud source verified ${posts.length} complete articles; newest: ${posts[0].title}; ${posts[0].postTags.length} tags; ${posts[0].body_html.length} body characters`);
          const result = await runArticleSync({ execute: false, fetchPosts: () => fetchPostsRelay({ relayUrl }) });
          if (!result.ok) throw new Error('Article sync preview failed');
          const poll = await fetch('https://hq-substack-source-preview.heythisisandrewb.workers.dev/poll', { signal: AbortSignal.timeout(60000) });
          const status = await poll.json();
          if (!status.ok || !['would-seed', 'would-dispatch', 'unchanged'].includes(status.action)) throw new Error(`Watcher preview failed: ${JSON.stringify(status)}`);
          console.log(`Watcher discovery verified: ${JSON.stringify(status)}`);
          JS
      - name: Remove the temporary diagnostic Worker
        if: always()
        run: npx wrangler delete --config "$RUNNER_TEMP/substack-probe.json" --force
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test scripts/article-sync.test.mjs scripts/substack-watcher.test.mjs scripts/substack-browser-source.test.mjs
      - name: Configure watcher authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module -e 'const {WEBSUB_SECRET,RESEND_API_KEY}=process.env; if (!WEBSUB_SECRET || !RESEND_API_KEY) throw new Error("Watcher authentication or notification secret is missing"); process.stdout.write(JSON.stringify({WEBSUB_SECRET,RESEND_API_KEY}))' | npx wrangler secret bulk --config scripts/substack-relay.wrangler.jsonc
      - name: Deploy fixed-publication relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config scripts/substack-relay.wrangler.jsonc
      - name: Verify public posts are accessible
        run: |
          node --input-type=module <<'JS'
          import { fetchPostsRelay } from './scripts/substack-source.mjs';
          // New workers.dev routes can briefly return 404 while propagating.
          for (let attempt=1; attempt<=6; attempt++) {
            try {
              const { posts, pages } = await fetchPostsRelay();
              console.log(`Verified ${posts.length} public posts across ${pages} page(s); newest: ${posts[0].title}`);
              process.exit(0);
            } catch (error) {
              if (attempt === 6) throw error;
              console.log(`Relay not ready (attempt ${attempt}): ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
