# The small fixed-publication fetcher lives separately from the website.
# It changes only when its source changes, never on an hourly content sync.
name: Deploy Substack source relay

on:
  push:
    branches: [main]
    paths:
      - scripts/substack-post-html.mjs
      - scripts/substack-watcher.mjs
      - src/lib/automation-auth.mjs
      - src/lib/automation-notifications.mjs
      - scripts/substack-relay.mjs
      - scripts/substack-relay.wrangler.jsonc
      - .github/workflows/deploy-substack-relay.yml
  workflow_dispatch:
    inputs:
      diagnose_source:
        description: 'Probe public Substack connectivity in an isolated temporary Worker'
        type: boolean
        default: false

concurrency:
  group: substack-relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b10b7bc3e6a0fd361ba0956c8aa7d307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Create isolated diagnostic configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/substack-probe.json`, JSON.stringify({
            name: 'hq-substack-network-probe', main: `${process.cwd()}/scripts/substack-network-probe.mjs`,
            compatibility_date: '2026-10-27', workers_dev: true,
          }));
          JS
      - name: Probe cloud connectivity without changing the production relay
        run: |
          npx wrangler deploy --config "$RUNNER_TEMP/substack-probe.json"
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 10; attempt++) {
            const response = await fetch('https://hq-substack-network-probe.heythisisandrewb.workers.dev', { signal: AbortSignal.timeout(100000) });
            if (response.ok) { console.log(JSON.stringify(await response.json(), null, 2)); process.exit(0); }
            if (response.status !== 404) throw new Error(`Probe returned HTTP ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Probe route did not propagate');
          JS
      - name: Remove the temporary diagnostic Worker
        if: always()
        run: npx wrangler delete --config "$RUNNER_TEMP/substack-probe.json" --force
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test scripts/article-sync.test.mjs scripts/substack-watcher.test.mjs
      - name: Configure watcher authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module -e 'const {WEBSUB_SECRET,RESEND_API_KEY}=process.env; if (!WEBSUB_SECRET || !RESEND_API_KEY) throw new Error("Watcher authentication or notification secret is missing"); process.stdout.write(JSON.stringify({WEBSUB_SECRET,RESEND_API_KEY}))' | npx wrangler secret bulk --config scripts/substack-relay.wrangler.jsonc
      - name: Deploy fixed-publication relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config scripts/substack-relay.wrangler.jsonc
      - name: Verify public posts are accessible
        run: |
          node --input-type=module <<'JS'
          import { fetchPostsRelay } from './scripts/substack-source.mjs';
          // New workers.dev routes can briefly return 404 while propagating.
          for (let attempt=1; attempt<=6; attempt++) {
            try {
              const { posts, pages } = await fetchPostsRelay();
              console.log(`Verified ${posts.length} public posts across ${pages} page(s); newest: ${posts[0].title}`);
              process.exit(0);
            } catch (error) {
              if (attempt === 6) throw error;
              console.log(`Relay not ready (attempt ${attempt}): ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
